<!DOCTYPE html>
<html lang="fr" data-density="terrain">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Thème posé avant l'application : pas de flash clair en mode sombre (même règle que src/lib/theme.ts).
      (function () {
        var pref = null
        try { pref = localStorage.getItem('commercial-theme') } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f0f0f' : '#ffffff')
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/commercial/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/aurescrm/images/commercial-icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/aurescrm/images/commercial-apple-touch-180.png?v=2" />
    <title>Aures Commercial</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
